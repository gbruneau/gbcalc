# ansi16 -- named colours only, so it looks the same on any terminal that
# can manage sixteen of them (including a plain Linux console).

name             ansi16
border           ascii

frame            fg=blue bold
title.style      fg=brightcyan bold
status           fg=blue
status.mode      fg=brightcyan bold
status.inv       fg=brightmagenta bold
status.mem       fg=brightyellow bold
display          fg=brightwhite bold
display.error    fg=brightred bold
aux              fg=cyan
hint             fg=brightblack
help.title       fg=brightcyan bold
help.text        fg=white

key.digit        fg=black bg=white
key.hexdigit     fg=black bg=cyan
key.operator     fg=black bg=yellow
key.sci          fg=brightwhite bg=blue
key.bitwise      fg=black bg=magenta
key.mode         fg=black bg=brightcyan
key.memory       fg=black bg=brightyellow
key.edit         fg=brightwhite bg=red
key.equals       fg=black bg=brightgreen bold
key.paren        fg=brightwhite bg=brightblack

state.focus      swap bold
state.active     fg=black bg=brightgreen bold
state.disabled   fg=brightblack bg=default dim none
