# amber -- a single-hue theme in the spirit of an old desk calculator:
# glowing display, dark keys, brighter as the key gets more destructive.

name             amber
border           heavy
brackets         [ ]

frame            fg=#8c5a12
title.style      fg=#ffb000 bold
status           fg=#8c5a12
status.mode      fg=#ffb000 bold
status.inv       fg=#fff1c1 bold
status.mem       fg=#ffb000 bold
display          fg=#ffb000 bold
display.error    fg=#ff5f1f bold
aux              fg=#8c5a12
hint             fg=#5c3a0a
help.title       fg=#ffb000 bold
help.text        fg=#c98a20

key              fg=#ffb000 bg=#1a1204
key.digit        fg=#ffd280 bg=#2b1d06
key.hexdigit     fg=#c98a20 bg=#241705
key.operator     fg=#1a1204 bg=#c98a20
key.sci          fg=#ffb000 bg=#1a1204
key.bitwise      fg=#ffb000 bg=#241705
key.mode         fg=#1a1204 bg=#8c5a12
key.memory       fg=#ffd280 bg=#241705
key.edit         fg=#1a1204 bg=#ff5f1f
key.equals       fg=#1a1204 bg=#ffb000 bold
key.paren        fg=#c98a20 bg=#1a1204

state.focus      swap bold
state.active     fg=#1a1204 bg=#ffd280 bold
state.disabled   fg=#4a3208 bg=default dim none
