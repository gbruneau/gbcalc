# mono -- no colour at all, categories separated by weight and border style.
# Useful over a slow link, in a 16-colour terminal, or for screenshots.
#
# A theme only needs the lines it changes; everything else stays as the
# built-in default (see `gbcalc --dump-theme`).

name             mono
border           square

frame            fg=default bold
title.style      fg=default bold
status           fg=default dim
status.mode      fg=default bold
status.inv       fg=default bold underline
status.mem       fg=default bold
display          fg=default bold
display.error    fg=default bold reverse
aux              fg=default dim
hint             fg=default dim
help.title       fg=default bold
help.text        fg=default

# Every key is plain; the categories differ by attribute rather than hue.
key              fg=default bg=default none
key.digit        fg=default bg=default bold
key.hexdigit     fg=default bg=default
key.operator     fg=default bg=default bold
key.sci          fg=default bg=default
key.bitwise      fg=default bg=default
key.mode         fg=default bg=default
key.memory       fg=default bg=default
key.edit         fg=default bg=default
key.equals       fg=default bg=default bold underline
key.paren        fg=default bg=default

state.focus      reverse bold
state.active     bold underline
state.disabled   dim none
